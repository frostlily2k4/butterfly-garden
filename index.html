<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Butterfly Garden 🦋</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="garden-container">

        <!-- Header -->
        <header>
            <h1>🦋 Butterfly Garden</h1>
            <p>A tiny garden that grows with you 🌸</p>
        </header>

        <!-- Garden -->
        <main class="garden">

            <div class="garden-title">
                <span>♡</span>
                <h2>Your Garden</h2>
                <span>♡</span>
            </div>

            <p class="garden-message">
                Your garden is waiting to bloom... 🌱
            </p>

            <!-- Empty garden -->
            <div class="garden-area">

                <div class="grass">🌱</div>
                <div class="grass grass-2">🌱</div>
                <div class="grass grass-3">🌱</div>

            </div>

        </main>

        <!-- Action buttons -->
        <section class="actions">

            <button id="plantBtn">
                🌷 Plant a Flower
            </button>

            <button id="waterBtn">
                💧 Water Garden
            </button>

        </section>

        <!-- Progress -->
        <section class="progress">

            <p>🌱 Garden Progress</p>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <span>0 / 10 🌸</span>

        </section>

        <footer>
            Made with ♡ and a little magic ✨
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
